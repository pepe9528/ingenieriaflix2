<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IngenieríaFlix</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#141414;
    color:white;
}

/* HEADER */

header{
    background:black;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
    position:sticky;
    top:0;
}

.logo{
    color:red;
    font-size:32px;
    font-weight:bold;
}

input{
    width:250px;
    padding:10px;
    border:none;
    border-radius:8px;
}

/* HERO */

.hero{
    text-align:center;
    padding:40px;
}

.hero h1{
    font-size:42px;
    margin-bottom:10px;
}

/* BOTONES */

.categorias{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:30px;
}

button{
    padding:10px 20px;
    border:none;
    border-radius:8px;
    background:red;
    color:white;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}

/* VIDEOS */

#listaVideos{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    padding:20px;
}

.video{
    background:#222;
    padding:15px;
    border-radius:12px;
}

.video h3{
    margin-bottom:10px;
    text-align:center;
}

/* FOOTER */

footer{
    background:black;
    text-align:center;
    padding:20px;
    margin-top:30px;
}

</style>

</head>
<body>


<header>

    <div class="logo">
        IngenieríaFlix
    </div>

    <input
    type="text"
    id="buscador"
    placeholder="Buscar..."
    onkeyup="buscarVideos()">

</header>


<section class="hero">

    <h1>
        Aprende Ingeniería Gratis
    </h1>

    <p>
        ASM, Arduino, Python y más
    </p>

</section>



<div class="categorias">

    <button onclick="filtrar('todo')">
        Todo
    </button>

    <button onclick="filtrar('asm')">
        ASM
    </button>

    <button onclick="filtrar('arduino')">
        Arduino
    </button>

    <button onclick="filtrar('python')">
        Python
    </button>

</div>



<div id="listaVideos">


    <div class="video asm">

        <h3>ASM 8086</h3>

        <iframe
        width="350"
        height="200"
        src="https://www.youtube.com/embed/Ug4RAbj7exU"
        allowfullscreen>
        </iframe>

    </div>



    <div class="video arduino">

        <h3>Arduino básico</h3>

        <iframe
        width="350"
        height="200"
        src="https://www.youtube.com/embed/89xMbK8jR8Q"
        allowfullscreen>
        </iframe>

    </div>



    <div class="video python">

        <h3>Python desde cero</h3>

        <iframe
        width="350"
        height="200"
        src="https://www.youtube.com/embed/nKPbfIU442g"
        allowfullscreen>
        </iframe>

    </div>


</div>



<footer>

    © 2026 IngenieríaFlix

</footer>



<script>


function filtrar(categoria){

    let videos =
    document.querySelectorAll(".video");


    videos.forEach(video=>{


        if(categoria=="todo"){

            video.style.display="block";

        }

        else if(
        video.classList.contains(categoria)){

            video.style.display="block";

        }

        else{

            video.style.display="none";

        }


    });


}




function buscarVideos(){


    let texto =

    document
    .getElementById("buscador")
    .value
    .toLowerCase();



    let videos =

    document
    .querySelectorAll(".video");



    videos.forEach(video=>{


        let titulo =

        video
        .innerText
        .toLowerCase();



        if(
        titulo.includes(texto)){

            video.style.display="block";

        }

        else{

            video.style.display="none";

        }


    });



}


</script>



</body>
</html>
